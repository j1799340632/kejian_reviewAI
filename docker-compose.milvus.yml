# Milvus Standalone + Attu 可视化界面
#
# 启动：  docker compose -f docker-compose.milvus.yml up -d
# 查看：  docker compose -f docker-compose.milvus.yml ps
# 日志：  docker compose -f docker-compose.milvus.yml logs -f standalone
# 停止：  docker compose -f docker-compose.milvus.yml down
# 清库：  docker compose -f docker-compose.milvus.yml down -v && rm -rf volumes
#
# 端口说明：
#   19530  Milvus gRPC 服务端口（Python 客户端连这个）
#   9091   Milvus 健康检查 / WebUI
#   9001   MinIO 控制台（账号 minioadmin / minioadmin）
#   8001   Attu 可视化界面（避免与 FastAPI 的 8000 端口冲突）

services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.6.16
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"

  # 可视化界面：能直接看到 collection 里有多少数据、字段长什么样
  # 调试期非常有用，不想要可以整段删掉
  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.5
    environment:
      MILVUS_URL: standalone:19530
    ports:
      - "8001:3000"
    depends_on:
      - "standalone"

networks:
  default:
    name: milvus
